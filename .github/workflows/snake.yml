name: Contribution snake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#ff4f9a&color_dots=#ebedf0,#a5f3fc,#22d3ee,#a78bfa,#ff4f9a
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff4f9a&color_dots=#161b22,#0e4f63,#22d3ee,#a78bfa,#ff4f9a

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
